<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#1e293b"/>
  <!-- Scaffold tower -->
  <g stroke="#94a3b8" stroke-width="4">
    <line x1="200" y1="100" x2="200" y2="550"/>
    <line x1="380" y1="100" x2="380" y2="550"/>
    <line x1="560" y1="100" x2="560" y2="550"/>
    <!-- Platforms -->
    <line x1="180" y1="220" x2="580" y2="220" stroke="#f59e0b" stroke-width="8"/>
    <line x1="180" y1="380" x2="580" y2="380" stroke="#f59e0b" stroke-width="8"/>
    <!-- Cross bracings -->
    <line x1="200" y1="100" x2="380" y2="220"/>
    <line x1="380" y1="100" x2="200" y2="220"/>
    <line x1="380" y1="100" x2="560" y2="220"/>
    <line x1="560" y1="100" x2="380" y2="220"/>
    <line x1="200" y1="220" x2="380" y2="380"/>
    <line x1="380" y1="220" x2="200" y2="380"/>
    <line x1="380" y1="220" x2="560" y2="380"/>
    <line x1="560" y1="220" x2="380" y2="380"/>
  </g>
  <!-- Missing Guardrail alert box -->
  <rect x="220" y="160" width="140" height="55" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="230" y="195" fill="#ef4444" font-family="sans-serif" font-weight="bold" font-size="14">MISSING RAIL</text>
  <!-- Worker on platform -->
  <circle cx="470" cy="170" r="14" fill="#fbbf24"/>
  <rect x="460" y="185" width="20" height="32" fill="#ea580c"/>
  <rect x="462" y="217" width="7" height="22" fill="#1e3a8a"/>
  <rect x="471" y="217" width="7" height="22" fill="#1e3a8a"/>
  <!-- Warning badge -->
  <rect x="40" y="40" width="340" height="44" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444"/>
  <text x="60" y="68" fill="#fca5a5" font-family="sans-serif" font-size="16" font-weight="bold">HAZARD: Elevated Working Without Tie-off</text>
</svg>
