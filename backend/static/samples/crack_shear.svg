<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#334155"/>
  <!-- Concrete Beam with 45 degree shear crack -->
  <rect x="80" y="160" width="640" height="240" fill="#64748b" stroke="#475569" stroke-width="6"/>
  <!-- Column Support on Left -->
  <rect x="80" y="400" width="140" height="160" fill="#475569"/>
  <!-- Diagonal 45-degree shear crack line -->
  <path d="M220,380 Q290,300 350,260 T410,210" fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round"/>
  <!-- Micro branch cracks -->
  <path d="M280,310 L260,335" fill="none" stroke="#0f172a" stroke-width="4"/>
  <path d="M340,270 L365,290" fill="none" stroke="#0f172a" stroke-width="4"/>
  <!-- Measurement annotation -->
  <line x1="200" y1="390" x2="430" y2="200" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="260" y="160" width="180" height="32" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444"/>
  <text x="270" y="182" fill="#fca5a5" font-size="13" font-family="sans-serif" font-weight="bold">SHEAR CRACK: 3.8mm width</text>
  <!-- Header -->
  <rect x="40" y="40" width="360" height="44" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444"/>
  <text x="60" y="68" fill="#fca5a5" font-family="sans-serif" font-size="16" font-weight="bold">STRUCTURAL DEFECT: 45° Shear Failure</text>
</svg>
