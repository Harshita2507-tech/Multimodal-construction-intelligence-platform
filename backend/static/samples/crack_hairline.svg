<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8fafc"/>
  <!-- Plaster / Paint texture background -->
  <rect x="60" y="80" width="680" height="440" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Hairline crack zig-zag -->
  <path d="M260,130 L275,180 L255,230 L285,290 L270,340 L295,410 L280,470" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Subtle branching -->
  <path d="M275,180 L295,195" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M270,340 L250,355" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- Annotation callout -->
  <line x1="285" y1="290" x2="420" y2="290" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="420" y="270" width="220" height="36" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="430" y="293" fill="#0369a1" font-size="12" font-family="sans-serif" font-weight="bold">Hairline Shrinkage (&lt;0.5mm)</text>
  <!-- Header -->
  <rect x="40" y="25" width="350" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="55" y="50" fill="#0369a1" font-family="sans-serif" font-size="15" font-weight="bold">COSMETIC: Non-Structural Hairline Crack</text>
</svg>
