<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0f172a"/>
  <!-- Structural grid -->
  <line x1="0" y1="480" x2="800" y2="480" stroke="#334155" stroke-width="6"/>
  <!-- Compliant Workers with Hardhats and Vests -->
  <g transform="translate(180, 260)">
    <circle cx="30" cy="30" r="18" fill="#eab308"/> <!-- Yellow Hardhat -->
    <rect x="15" y="50" width="30" height="70" fill="#22c55e" rx="4"/> <!-- Hi-Vis Green Vest -->
    <rect x="18" y="120" width="10" height="80" fill="#1e293b"/>
    <rect x="32" y="120" width="10" height="80" fill="#1e293b"/>
    <rect x="14" y="195" width="16" height="12" fill="#78350f"/> <!-- Steel boots -->
    <rect x="30" y="195" width="16" height="12" fill="#78350f"/>
    <!-- Compliant tag -->
    <rect x="-10" y="-30" width="80" height="24" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
    <text x="-2" y="-14" fill="#86efac" font-size="11" font-weight="bold" font-family="sans-serif">PPE 100%</text>
  </g>
  <g transform="translate(420, 260)">
    <circle cx="30" cy="30" r="18" fill="#ffffff"/> <!-- White Engineer Hardhat -->
    <rect x="15" y="50" width="30" height="70" fill="#f97316" rx="4"/> <!-- Orange Vest -->
    <rect x="18" y="120" width="10" height="80" fill="#334155"/>
    <rect x="32" y="120" width="10" height="80" fill="#334155"/>
    <rect x="14" y="195" width="16" height="12" fill="#78350f"/>
    <rect x="30" y="195" width="16" height="12" fill="#78350f"/>
    <rect x="-10" y="-30" width="80" height="24" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
    <text x="-2" y="-14" fill="#86efac" font-size="11" font-weight="bold" font-family="sans-serif">PPE 100%</text>
  </g>
  <!-- Safety Score Badge -->
  <rect x="40" y="40" width="320" height="44" rx="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e"/>
  <text x="60" y="68" fill="#86efac" font-family="sans-serif" font-size="16" font-weight="bold">SITE STATUS: Fully Compliant (Score: 94)</text>
</svg>
